name: AI PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

  issue_comment:
    types: [created]

  workflow_call:
    inputs:
      pr_number:
        description: "PR number to review"
        required: false
        type: number
      repository:
        description: "Target repository in owner/repo format"
        required: true
        type: string
      event_name:
        description: "Triggering event name"
        required: false
        type: string
        default: "pull_request"
      comment_body:
        description: "Body of the triggering comment (for issue_comment trigger)"
        required: false
        type: string
        default: ""
      issue_number:
        description: "Issue/PR number (for issue_comment trigger)"
        required: false
        type: number
    secrets:
      GH_PAT:
        required: false
        description: >
          Optional GitHub PAT with pull-requests:write on the target repo.
          Falls back to the caller GITHUB_TOKEN automatically.

jobs:
  review:
    name: AI PR Analysis
    runs-on: ubuntu-latest
    # Skip bot-authored comments and non-PR issue comments
    if: >
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request != null &&
        !github.event.comment.performed_via_github_app &&
        contains(github.event.comment.body, 'ai summarize')
      )
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout ai-code-reviewer
        uses: actions/checkout@v4
        with:
          repository: nidhinsai/ai-code-reviewer
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI PR Analysis
        env:
          # GITHUB_TOKEN is auto-injected by Actions and grants access to GitHub Models
          # via your Copilot subscription. No extra API key required.
          GH_TOKEN:      ${{ secrets.GH_PAT || github.token }}
          PR_NUMBER:     ${{ inputs.pr_number || github.event.pull_request.number || '' }}
          REPO:          ${{ inputs.repository || github.repository }}
          REVIEW_MODEL:  gpt-4o
          EVENT_NAME:    ${{ inputs.event_name || github.event_name }}
          COMMENT_BODY:  ${{ inputs.comment_body || github.event.comment.body || '' }}
          ISSUE_NUMBER:  ${{ inputs.issue_number || github.event.issue.number || '' }}
        run: python scripts/review.py
