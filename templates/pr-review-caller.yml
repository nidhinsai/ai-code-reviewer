# Copy this file to .github/workflows/pr-review.yml in any repository
# you want the AI code reviewer to monitor.
#
# Prerequisites:
#   - A GitHub Copilot subscription (individual or business).
#   - Nothing else. GITHUB_TOKEN is injected automatically by GitHub Actions.

name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    uses: nidhinsai/ai-code-reviewer/.github/workflows/pr-review.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}
      repository: ${{ github.repository }}
    # No secrets needed — GITHUB_TOKEN is used automatically.
    # Uncomment only if you need an explicit cross-repo PAT:
    # secrets:
    #   GH_PAT: ${{ secrets.GH_PAT }}
    permissions:
      pull-requests: write
      contents: read
